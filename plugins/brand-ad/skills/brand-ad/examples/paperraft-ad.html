// ── montage (23.5 – 29.4), converging into the mark (29 – 31)
function actMontage(b) {
  const on = win(b, 23.4, 31.2); show(E.mont, on); show(E.montPaint, on); if (!on) return;
  const conv = ease(prog(b, 28.9, 1.1));
  MONTAGE.forEach((m, i) => {
    const c = E.shots[i]; const vis = b >= m.at && b < Math.max(m.out + 0.6, m === MONTAGE[MONTAGE.length - 1] ? 31.2 : 0);
    show(c, vis); if (c.mark) show(c.mark, vis); if (!vis) return;
    const isFig = m.src.includes('figs'); const key = m.src.split('/').pop().replace('.png', '');
    const n = isFig ? FIGSZ[key] : [PAGE_W, PAGE_H]; const w = m.w, h = isFig ? w * n[1] / n[0] + 50 : w * PAGE_H / PAGE_W;
    const inn = Math.max(0, track(b, 0, [[m.at, 1, 19, .62]])), outk = track(b, 0, [[m.out, 1, 16, .95]]);
    let x = m.x, y = m.y, s = 1;
    const off = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], zoom: [0, 0] }[m.from];
    if (m.from === 'zoom') s = lerp(0.2, 1, inn); else { x += off[0] * 1500 * (1 - inn); y += off[1] * 1500 * (1 - inn); }
    // leave: keep moving the same way it came
    if (m.from === 'zoom') s *= 1 + outk * 3; else { x -= off[0] * 1700 * outk; y -= off[1] * 1700 * outk; }
    const last = i === MONTAGE.length - 1;
    if (last) { const ms = lerp(1, 0.0, conv); s = Math.max(0, track(b, 0, [[m.at, 1, 19, .62]])) * (1 - conv); y = lerp(y, 690, conv); }
    S(c, { left: px(x - w / 2), top: px(y - h / 2), width: px(w), height: px(h), borderRadius: '16px', transform: `scale(${Math.max(0, s).toFixed(4)})` });
    if (isFig) placeImg(c, w, h, key, 'fig'); else { S(c.img, { width: px(w), left: 0, top: 0 }); }
    if (c.mark) {
      const sw = w * s, sh = h * s, k = easeOut(prog(b, m.at + 0.25, 0.35));
      let d;
      if (m.mark === 'loop') d = loop(x, y, sw * 0.56, sh * 0.6, i);
      else if (m.mark === 'under') d = `M${x - sw * 0.42} ${y + sh * 0.56}C${x - sw * 0.1} ${y + sh * 0.5} ${x + sw * 0.15} ${y + sh * 0.62} ${x + sw * 0.42} ${y + sh * 0.54}`;
      else d = tick(x + sw * 0.18, y - sh * 0.38, Math.min(160, sw * 0.4));
      c.mark.setAttribute('d', d); draw(c.mark, k * (last ? 1 - conv : 1));
    }
  });
}

// ── logo: the Paperraft wordmark (Iowan Old Style, -0.04em), born from an ink bar (29.4 – 35)
function actLogo(b) {
  const on = b >= 29.4; show(E.logoL, on); show(E.url, on); Object.values(E.mk).forEach(p => show(p, false)); if (!on) return;
  const L = W0.logo;
  // an ink line grows out of the collapsing image, then the wordmark rises out of it on the hit and the line pulls in
  const g = Math.max(0, track(b, 0, [[29.5, 1, 15, .7]])) * (1 - ease(prog(b, 31.05, 0.5)));
  const bw = L.barW * g;
  E.logoBar.setAttribute('x', (720 - bw / 2).toFixed(1)); E.logoBar.setAttribute('width', Math.max(0, bw).toFixed(1)); show(E.logoBar, bw > 0.5);
  const rise = 1 - track(b, 0, [[30.95, 1, 15, .78]]);
  E.logoWord.set(W0.logoRings, `translate(0 ${(rise * L.h).toFixed(1)})`, b >= 30.95);
  S(E.urlTx, { transform: `translateY(${px((1 - track(b, 0, [[32.0, 1, 18, .8]])) * 80)})` });
}

// ═════════════════════ boot ═════════════════════
window.ready = (async () => {
  DATA = await (await fetch('data.json')).json();
  FONT = await new Promise((res, rej) => opentype.load('assets/fonts/BeVietnamPro-ExtraBold.ttf', (e, f) => e ? rej(e) : res(f)));
  await document.fonts.load('600 50px BVP'); await document.fonts.load('700 78px BVP'); await document.fonts.load('500 50px "Geist Mono"'); await document.fonts.ready;
  await Promise.all(FIGS.map(f => new Promise(r => { const i = new Image(); i.onload = () => { FIGSZ[f] = [i.naturalWidth, i.naturalHeight]; r(); }; i.src = `assets/figs/${f}.png`; })));
  build();
  // words
  const paper = fit('paper', 1200, 420, 720, 700);
  W0.aHole = paper.holes.find(h => h.cx > paper.bb.x1 + (paper.bb.x2 - paper.bb.x1) * 0.2 && h.cx < paper.bb.x1 + (paper.bb.x2 - paper.bb.x1) * 0.45) || paper.holes[1];
  const r0 = { outers: [rectRing(720 - G.w / 2, 720 - G.h / 2, G.w, G.h)], holes: [] };
  W0.rect2paper = new Morph(r0, paper);
  const test = fit('test', 1000, 420, 720, 720);
  // the highlight bar on page 4 at its final camera (same numbers as claimCam settles to)
  const s = 1.55, hx = 720 - (CLAIM.x + CLAIM.w / 2) * s + CLAIM.x * s, hy = 470, hw = CLAIM.w * s, hh = CLAIM.h * s * 1.25;
  W0.hl2test = new Morph({ outers: [rectRing(hx, hy - hh / 2, hw, hh)], holes: [] }, test);
  const N = DATA.numbers;
  const words = [`${N.runsPass}/${N.runs}`, `${N.methodsVerified}/${N.methods}`, N.exactError.toExponential(1), 'verified'].map(w => fit(w, 960, 330, 720, 690));
  W0.n0 = new Morph(words[0], words[0]);
  W0.nums = [new Morph(words[0], words[1]), new Morph(words[1], words[2]), new Morph(words[2], words[3])];
  W0.verBB = words[3].bb;
  // logo: the Paperraft wordmark
  SERIF = await new Promise((res, rej) => opentype.load('assets/fonts/private/IowanOldStyle-Roman.ttf', (e, f) => e ? rej(e) : res(f)));
  const lw = (() => { const bb = SERIF.getPath('Paperraft', 0, 0, 300, { tracking: -40 }).getBoundingBox(); return bb.x2 - bb.x1; })();
  const ls = 300 * Math.min(1, 1000 / lw);
  const logoWord = ringsOf('Paperraft', ls, 720, 700, SERIF, { tracking: -40 });
  W0.logo = { barW: (logoWord.bb.x2 - logoWord.bb.x1) * 0.92, barY: 700 + (logoWord.bb.y2 - logoWord.bb.y1) * 0.12 };
  W0.logoRings = [logoWord.outers.map(r => r.d).join(''), logoWord.holes.map(r => r.d).join('')];
  W0.logo.h = logoWord.bb.y2 - logoWord.bb.y1 + 30; W0.logo.barY = logoWord.bb.y2 + 12;
  const cp = sv(E.logoL.svg.querySelector('defs'), 'clipPath', { id: 'logoclip', clipPathUnits: 'userSpaceOnUse' }); sv(cp, 'rect', { x: 0, y: 0, width: 1440, height: W0.logo.barY - 7 });
  const clipG = sv(E.logoL.svg, 'g', { 'clip-path': 'url(#logoclip)' }); clipG.appendChild(E.logoWord.g);
  E.logoBar = sv(E.logoL.svg, 'rect', { x: 720, y: W0.logo.barY - 7, width: 0, height: 14, rx: 7, fill: 'var(--ink)' });
  S(E.url, { top: px(logoWord.bb.y2 + 70) });
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await window.seek(0);
  if (!new URLSearchParams(location.search).has('render')) { const t0 = performance.now(); const f = async () => { await window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(f); }; f(); }
})();
